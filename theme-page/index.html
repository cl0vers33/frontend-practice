  <h1>夜鹿乐队（yorushika）</h1>
  <p>Yorushika（ヨルシカ），日本音乐组合，由词曲创作者n-buna、主唱suis组成。</p>
  <p>擅长通过一张专辑编织出一个大故事，专辑中的每首歌曲都在故事中占有一席之地并很好地发挥各自的作用。</p>
